name: Mersal Client

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  linux:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: nttld/setup-ndk@v1.4.2
        id: setup-ndk-r27c
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install NDK for the JNI build (ndkVersion).
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - name: Prepare additional build number.
        env:
          ADDITIONAL_BUILD: ${{ secrets.ADDITIONAL_BUILD_NUMBER }}
        run: |
          result=$((ADDITIONAL_BUILD / 10000))
          echo "ADDITIONAL_BUILD_NUMBER = $result should be between 0 and 10!"
          echo "ADDITIONAL_BUILD_NUMBER=$result" >> $GITHUB_ENV
          echo "USER_REPO=$GITHUB_REPOSITORY" >> $GITHUB_ENV
          echo "CHECK_UPDATES=1" >> $GITHUB_ENV
      - name: Build.
        run: |
          ###
          vars=gradle.properties

          echo "DUMMY_CONST=0" >> $vars
          echo "org.gradle.workers.max=1" >> $vars

          echo "APP_ID=${{ secrets.APP_ID }}" >> $vars
          echo "APP_HASH=${{ secrets.APP_HASH }}" >> $vars

          KEY_PASS="${{ secrets.ALIAS_PASS }}"
          KEY_ALIAS="${{ secrets.ALIAS_NAME }}"
          STORE_PASS="${{ secrets.KEYSTORE_PASS }}"
          if [ -z "$KEY_PASS" ]; then KEY_PASS="android"; fi
          if [ -z "$KEY_ALIAS" ]; then KEY_ALIAS="androidkey"; fi
          if [ -z "$STORE_PASS" ]; then STORE_PASS="android"; fi

          KEYSTORE_FILE="$PWD/TMessagesProj/config/release.keystore"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Generating fallback keystore..."
            keytool -genkey -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Mersal, OU=Client, O=Mersal, L=Unknown, S=Unknown, C=XX"
          fi

          echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> $vars
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> $vars
          echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> $vars
          echo "RELEASE_KEYSTORE_FILE=$KEYSTORE_FILE" >> $vars
          echo "ADDITIONAL_BUILD_NUMBER=$ADDITIONAL_BUILD_NUMBER" >> $vars
          echo "USER_REPO=$USER_REPO" >> $vars
          echo "CHECK_UPDATES=1" >> $vars
          echo "USER_ID_OWNER=${{ secrets.USER_ID_OWNER }}" >> $vars
          echo "UPDATE_CHANNEL_USERNAME=${{ secrets.UPDATE_CHANNEL_USERNAME }}" >> $vars
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> $vars
          echo "LASTFM_API_SECRET=${{ secrets.LASTFM_API_SECRET }}" >> $vars

          ###
          echo $ADDITIONAL_BUILD_NUMBER
          sudo apt update
          sudo apt -y install ninja-build meson nasm gperf pkg-config unzip pip
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup toolchain install 1.96.1 -t aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          ./gradlew :TMessagesProj_App:assembleAfatFd_v8aRelease || ./gradlew :TMessagesProj_App:assembleAfatRelease

          ver="1.0.0"
          if [ -f TMessagesProj/build/generated/source/buildConfig/release/org/telegram/messenger/BuildConfig.java ]; then
            ver=$(grep VERSION_NAME TMessagesProj/build/generated/source/buildConfig/release/org/telegram/messenger/BuildConfig.java | cut -d'"' -f 2 || echo "1.0.0")
          fi
          echo "$ver" > ver.txt

          mkdir -p artifact
          mkdir -p tag_asset

          apk_file=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$apk_file" ]; then
            cp "$apk_file" app.apk
            cp "$apk_file" "artifact/Mersal_$(cat ver.txt)_arm64-v8a.apk"
            cp "$apk_file" "tag_asset/Mersal_$(cat ver.txt)_arm64-v8a.apk"
          fi

          # Upload to channel.
          if [[ "${{ contains(github.event.head_commit.message, '[Release]') }}" == "true" ]]; then
            FORK_UPLOAD_MODE=release
          elif [[ "${{ contains(github.event.head_commit.message, '[Optional]') }}" == "true" ]]; then
            FORK_UPLOAD_MODE=optional
          else
            FORK_UPLOAD_MODE=
          fi
          if [[ -n "$FORK_UPLOAD_MODE" ]] && [[ -n "${{ secrets.BASE64_ZIP }}" ]]; then
            set +x
            pip install requests tgcrypto-pyrofork Kurigram
            cp app.apk "ForkClient $(cat ver.txt).apk"
            echo "${{ secrets.BASE64_ZIP }}" | base64 --decode > output.zip
            unzip -j output.zip -d .
            ls
            FORK_UPLOAD_MODE=$FORK_UPLOAD_MODE python3 upload.py
            set -x
          else
            echo "Skipping channel upload."
          fi
          ###

          echo "NEW_TAG_TEXT=$(cat ver.txt)" >> $GITHUB_ENV

          tempVer=$(cat ver.txt)
          tempVer=${tempVer::-2}
          echo "NEW_OFFICIAL_TAG_TEXT=$tempVer" >> $GITHUB_ENV
      - name: Attest build provenance
        if: ${{ contains(github.event.head_commit.message, '[Release]') }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifact/*.apk'

      - uses: actions/upload-artifact@v4
        name: Upload APK Artifact
        with:
          name: Mersal-arm64-v8a-apk
          path: artifact/*.apk
          if-no-files-found: warn

  release:
    name: Create Release.
    needs: linux
    if: ${{ contains(github.event.head_commit.message, '[Release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Mersal-arm64-v8a-apk
          path: asset
      - name: Get version info
        run: |
          find asset -name "*.apk" | head -1 | sed 's/.*Mersal_//;s/_arm64-v8a\.apk//' > version.txt
          echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV
          echo "OFFICIAL_VERSION=$(cat version.txt | sed 's/..$//')" >> $GITHUB_ENV
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          draft: true
          files: asset/*
          tag_name: ${{ env.VERSION }}
          name: "Mersal ${{ env.VERSION }}"
          body: "Mersal Client build."
